<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Real-Time Custom Data Streaming</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        html, body {\n            font-family: Arial, sans-serif;\n            background: #0d0e14;\n            color: #d1d4dc;\n            height: 100%;\n            overflow: hidden;\n        }\n        #fcs_chartparent { width: 100%; height: 100%; }\n        .info-overlay {\n            position: absolute;\n            top: 10px;\n            left: 10px;\n            background: rgba(20, 25, 40, 0.9);\n            border: 1px solid #2a2e42;\n            border-radius: 8px;\n            padding: 15px;\n            z-index: 1000;\n            font-size: 12px;\n            max-width: 300px;\n        }\n        .info-overlay h4 { margin-bottom: 10px; color: #4caf50; }\n        .info-overlay p { margin: 5px 0; }\n        .price { color: #4caf50; font-weight: bold; }\n        .timestamp { color: #9ca3af; }\n    </style>\n    <link rel=\"stylesheet\" href=\"../src/fcsapi-chart.css\">\n</head>\n<body>\n    <div id=\"fcs_chartparent\">\n        <div id=\"fcs_chart\"></div>\n    </div>\n\n    <div class=\"info-overlay\">\n        <h4>📡 Real-Time Stream</h4>\n        <p>Symbol: <span id=\"symbolInfo\">-</span></p>\n        <p>Price: <span class=\"price\" id=\"priceInfo\">-</span></p>\n        <p>Candles: <span id=\"candleCount\">0</span></p>\n        <p class=\"timestamp\" id=\"timeInfo\">-</p>\n    </div>\n\n    <script src=\"../src/fcsapi-chart.js\"></script>\n    <script src=\"../custom-data-adapter.js\"></script>\n\n    <script>\n        let chart;\n        let priceHistory = [];\n        let candleCount = 0;\n\n        function setMobileHeight() {\n            document.getElementById('fcs_chartparent').style.height = window.innerHeight + 'px';\n        }\n        setMobileHeight();\n        window.addEventListener('resize', setMobileHeight);\n\n        // Initialize chart\n        function initChart() {\n            chart = new FCSAPIChart({\n                container: document.getElementById('fcs_chart'),\n                parentid: 'fcs_chartparent',\n                enableCustomData: true,\n                theme: 'dark',\n                defaultChartType: 'candlestick',\n                enableIndicators: true\n            });\n        }\n\n        // Generate initial data\n        function generateInitialData() {\n            const candles = [];\n            let price = 50000;\n            let time = Math.floor(Date.now() / 1000) - 36000; // 10 hours back\n\n            for (let i = 0; i < 100; i++) {\n                const variance = (Math.random() - 0.5) * 1000;\n                const open = price + variance;\n                const close = open + (Math.random() - 0.5) * 1000;\n                const high = Math.max(open, close) + Math.random() * 500;\n                const low = Math.min(open, close) - Math.random() * 500;\n\n                candles.push({\n                    time: time + (i * 360),\n                    open: parseFloat(open.toFixed(2)),\n                    high: parseFloat(high.toFixed(2)),\n                    low: parseFloat(low.toFixed(2)),\n                    close: parseFloat(close.toFixed(2)),\n                    volume: Math.floor(Math.random() * 100000)\n                });\n\n                price = close;\n            }\n\n            return candles;\n        }\n\n        // Start real-time stream\n        function startRealtimeStream() {\n            const symbol = 'CUSTOM:BTCUSD';\n            const initialCandles = generateInitialData();\n\n            // Load initial data\n            chart.setCustomData(symbol, initialCandles);\n            candleCount = initialCandles.length;\n            let lastPrice = initialCandles[initialCandles.length - 1].close;\n\n            document.getElementById('symbolInfo').textContent = symbol;\n            document.getElementById('candleCount').textContent = candleCount;\n\n            // Stream new candles every 2 seconds\n            setInterval(() => {\n                const variance = (Math.random() - 0.5) * 500;\n                const open = lastPrice;\n                const close = open + variance;\n                const high = Math.max(open, close) + Math.random() * 300;\n                const low = Math.min(open, close) - Math.random() * 300;\n\n                const newCandle = {\n                    time: Math.floor(Date.now() / 1000),\n                    open: parseFloat(open.toFixed(2)),\n                    high: parseFloat(high.toFixed(2)),\n                    low: parseFloat(low.toFixed(2)),\n                    close: parseFloat(close.toFixed(2)),\n                    volume: Math.floor(Math.random() * 50000)\n                };\n\n                chart.appendCandle(newCandle);\n                lastPrice = close;\n                candleCount++;\n\n                // Update info\n                document.getElementById('priceInfo').textContent = `$${close.toFixed(2)}`;\n                document.getElementById('candleCount').textContent = candleCount;\n                document.getElementById('timeInfo').textContent = new Date().toLocaleTimeString();\n            }, 2000);\n        }\n\n        window.addEventListener('load', () => {\n            initChart();\n            startRealtimeStream();\n            console.log('Real-time streaming initialized');\n        });\n    </script>\n</body>\n</html>"
